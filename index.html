<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery Browser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <form id="pattern-form" class="controls" autocomplete="off">
      <div class="input-row">
        <input
          id="url-input"
          name="url"
          type="text"
          inputmode="url"
          spellcheck="false"
          required
          placeholder="https://example.com/gallery/image_01.jpg"
        />
        
        <button type="submit">Invia</button>

        <fieldset class="theme-switch" aria-label="Seleziona tema">
          <legend class="sr-only">Tema</legend>
          <input type="radio" name="theme-mode" id="theme-light" value="light" />
          <label for="theme-light" aria-label="Tema chiaro" title="Tema chiaro">
            <span class="theme-icon" aria-hidden="true">☀</span>
            <span class="sr-only">Tema chiaro</span>
          </label>
          <input type="radio" name="theme-mode" id="theme-auto" value="auto" />
          <label for="theme-auto" aria-label="Tema automatico" title="Tema automatico">
            <span class="theme-icon" aria-hidden="true">◐</span>
            <span class="sr-only">Tema automatico</span>
          </label>
          <input type="radio" name="theme-mode" id="theme-dark" value="dark" />
          <label for="theme-dark" aria-label="Tema scuro" title="Tema scuro">
            <span class="theme-icon" aria-hidden="true">☾</span>
            <span class="sr-only">Tema scuro</span>
          </label>
        </fieldset>

        <button
          id="query-sync-toggle"
          class="star-sync-toggle"
          type="button"
          aria-label="Salva pattern e indice nell'URL"
          aria-pressed="false"
          title="Salva pattern e indice nell'URL"
        >
          ☆
        </button>
      </div>
    </form>

    <!-- <section class="status-bar" aria-live="polite">
      <span id="index-output">Indice: -</span>
      <span id="message"></span>
    </section> -->

    <section class="viewer" aria-label="Visualizzatore immagini">
      <button id="prev-btn" class="nav-btn" type="button" aria-label="Immagine precedente">&#8592;</button>
      <div class="image-stage">
        <img id="gallery-image" alt="Anteprima galleria" />
      </div>
      <button id="next-btn" class="nav-btn" type="button" aria-label="Immagine successiva">&#8594;</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
